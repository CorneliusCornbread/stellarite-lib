plugins { id 'java-library'; id 'maven-publish'; id 'net.neoforged.moddev' version '1.0.21' }

repositories {
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    runtimeOnly "curse.maven:stellaris-${stellaris_curseforge_project_id}:${stellaris_curseforge_file_id}"
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
neoForge {
    version = neoforge_version
    parchment { minecraftVersion = minecraft_version; mappingsVersion = '2024.11.17' }
    runs {
        client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', mod_id }
        data { data(); programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath }
    }
    mods { stellarite_lib { sourceSet sourceSets.main } }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range, neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range, loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description, stellaris_version_range: stellaris_version_range]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}
